<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="weather-card">

            <h1>Weather Dashboard</h1>

            <p class="subtitle">
                Real-time weather information
            </p>

            <!-- Search -->
            <form id="searchForm">

                <input
                    type="text"
                    id="cityInput"
                    placeholder="Enter city name"
                    required
                >

                <button type="submit">
                    Search
                </button>

            </form>

            <!-- Loading -->
            <p id="loading" class="loading">
                Loading...
            </p>

            <!-- Error -->
            <div id="errorMessage" class="error"></div>

            <!-- Weather Result -->
            <div id="weatherResult" class="weather-result">

                <h2 id="cityName">--</h2>

                <p id="date">--</p>

                <div class="temperature">
                    <span id="temperature">--</span>°C
                </div>

                <p id="condition">--</p>

                <div class="weather-details">

                    <div class="detail">
                        <span>💧</span>
                        <p>Humidity</p>
                        <strong id="humidity">--%</strong>
                    </div>

                    <div class="detail">
                        <span>💨</span>
                        <p>Wind Speed</p>
                        <strong id="windSpeed">-- km/h</strong>
                    </div>

                    <div class="detail">
                        <span>🌡️</span>
                        <p>Feels Like</p>
                        <strong id="feelsLike">--°C</strong>
                    </div>

                    <div class="detail">
                        <span>☁️</span>
                        <p>Cloud Cover</p>
                        <strong id="cloudCover">--%</strong>
                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
